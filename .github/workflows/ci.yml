
name: CI
 
on:
  push:
  pull_request:
 
# Laufende Runs für denselben Branch/PR abbrechen, wenn neu gepusht wird
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend   # ANPASSEN: Ordner deines Backends
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"     # ANPASSEN: deine Python-Version
          cache: pip
          cache-dependency-path: Backend/requirements.txt
 
      - name: Dependencies installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Unit-Tests
        if: false   # TODO: aktivieren, sobald es Tests gibt
        run: pytest
 
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp  # ANPASSEN: Ordner deines Frontends
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 22           # ANPASSEN: deine Node-Version
          cache: npm
          cache-dependency-path: WebApp/package-lock.json
 
      - name: Dependencies installieren
        run: npm ci
 
      - name: Lint
        run: npm run lint
 
      - name: Unit-Tests
        if: false   # TODO: aktivieren, sobald es Tests gibt
        run: npm test
 
      - name: Build prüfen
        run: npm run build
 